# Dieser Workflow baut die App und stellt sie auf GitHub Pages online.
# Er läuft automatisch bei jedem Push auf "main".
name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt auch einen Start per Knopfdruck im Tab "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci          # Pakete genau nach package-lock.json installieren
      - run: npm run build   # fertige App landet im Ordner "dist"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
