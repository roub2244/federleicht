<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: Der Browser soll nicht selbst zoomen, das macht unsere App -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Federleicht</title>
    <meta name="description" content="Handschriftliche Notizen mit dem Stift" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <!-- Obere Leiste: links Rückgängig/Wiederholen, Mitte Werkzeuge, rechts Ansicht -->
    <header class="topbar">
      <div class="bar-left">
        <img class="logo" src="/icons/icon.svg" alt="" width="28" height="28" />
        <span class="brand-name">Federleicht</span>
        <button id="btn-undo" class="icon-btn" title="Rückgängig" aria-label="Rückgängig" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Wiederholen" aria-label="Wiederholen" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
        </button>
      </div>

      <div class="tools" role="toolbar" aria-label="Werkzeuge">
        <button class="tool-btn" data-tool="pen" title="Stift (nochmal tippen: Einstellungen)" aria-label="Stift">
          <svg viewBox="0 0 24 24">
            <path class="tip" d="M4.2 19.8 5 15.5l3.5 3.5z" />
            <path d="M15.5 4.5a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3L8.5 19.5 4 20l.5-4.5z" />
            <path d="m13.5 6.5 4 4" />
          </svg>
          <i class="swatch"></i>
        </button>
        <button class="tool-btn" data-tool="highlighter" title="Textmarker (nochmal tippen: Einstellungen)" aria-label="Textmarker">
          <svg viewBox="0 0 24 24">
            <path class="tip" d="M7 15.5 4 20h5l1.5-1.5z" />
            <path d="M16 3.5a2.1 2.1 0 0 1 3 0l1.5 1.5a2.1 2.1 0 0 1 0 3L13 15.5 8.5 11z" />
            <path d="m8.5 11-2 2 4.5 4.5 2-2" />
          </svg>
          <i class="swatch"></i>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Radierer (nochmal tippen: Einstellungen)" aria-label="Radierer">
          <svg viewBox="0 0 24 24">
            <path d="M8.5 20H20" />
            <path d="M4.6 14.6 13.6 5.6a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L11 19.8H8.2l-3.6-3.6a1.2 1.2 0 0 1 0-1.6z" />
            <path d="m9 10.5 5.5 5.5" />
          </svg>
        </button>
      </div>

      <div class="actions">
        <button id="btn-install" class="btn btn-accent" hidden>App installieren</button>
        <button id="btn-zoom" class="btn" title="Zoom zurücksetzen">100 %</button>
        <button id="btn-debug" class="icon-btn" title="Stift-Diagnose ein/aus" aria-label="Stift-Diagnose">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
        </button>
      </div>
    </header>

    <!-- Popup mit den Einstellungen des Werkzeugs (wird von toolbar.js gefüllt) -->
    <div id="popup" class="popup" hidden></div>

    <!-- Die Zeichenfläche -->
    <main id="stage">
      <canvas id="canvas"></canvas>
    </main>

    <!-- Diagnose-Fenster: zeigt, was der S Pen an die App schickt -->
    <aside id="debug" class="debug" hidden></aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
