<!doctype html>
<html lang="de" class="booting">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: Der Browser soll nicht selbst zoomen, das macht unsere App -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Federleicht</title>
    <meta name="description" content="Handschriftliche Notizen mit dem Stift" />
    <!-- Wir haben einen eigenen Dunkelmodus: der Browser soll die Seite nicht selbst abdunkeln -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- App-Icon: SVG für moderne Browser, PNG als Ersatz, eigenes Bild für iPhone/iPad -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Obere Leiste: links Rückgängig/Wiederholen, Mitte Werkzeuge, rechts Ansicht -->
    <header class="topbar">
      <div class="bar-left">
        <!-- Zurück zum Startbildschirm, daneben der Titel der Notiz (antippen = umbenennen) -->
        <button id="btn-home" class="icon-btn" title="Alle Notizen" aria-label="Alle Notizen">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button id="note-title" class="note-title" title="Umbenennen">
          <span class="nt-text">Notiz</span>
          <span class="nt-state" aria-live="polite"></span>
        </button>
        <button id="btn-undo" class="icon-btn" title="Rückgängig" aria-label="Rückgängig" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Wiederholen" aria-label="Wiederholen" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
        </button>
      </div>

      <div class="tools" role="toolbar" aria-label="Werkzeuge">
        <button class="tool-btn" data-tool="pen" title="Stift (nochmal tippen: Einstellungen)" aria-label="Stift">
          <svg viewBox="0 0 24 24">
            <path class="tip" d="M4.2 19.8 5 15.5l3.5 3.5z" />
            <path d="M15.5 4.5a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3L8.5 19.5 4 20l.5-4.5z" />
            <path d="m13.5 6.5 4 4" />
          </svg>
          <i class="swatch"><canvas class="paint" width="1" height="1"></canvas></i>
        </button>
        <button class="tool-btn" data-tool="highlighter" title="Textmarker (nochmal tippen: Einstellungen)" aria-label="Textmarker">
          <svg viewBox="0 0 24 24">
            <path class="tip" d="M7 15.5 4 20h5l1.5-1.5z" />
            <path d="M16 3.5a2.1 2.1 0 0 1 3 0l1.5 1.5a2.1 2.1 0 0 1 0 3L13 15.5 8.5 11z" />
            <path d="m8.5 11-2 2 4.5 4.5 2-2" />
          </svg>
          <i class="swatch"><canvas class="paint" width="1" height="1"></canvas></i>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Radierer (nochmal tippen: Einstellungen)" aria-label="Radierer">
          <svg viewBox="0 0 24 24">
            <path d="M8.5 20H20" />
            <path d="M4.6 14.6 13.6 5.6a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L11 19.8H8.2l-3.6-3.6a1.2 1.2 0 0 1 0-1.6z" />
            <path d="m9 10.5 5.5 5.5" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="lasso" title="Lasso: auswählen, verschieben, kopieren (nochmal tippen: Einstellungen)" aria-label="Lasso">
          <svg viewBox="0 0 24 24">
            <path d="M12 4c4.6 0 8 2.3 8 5.2s-3.4 5.2-8 5.2-8-2.3-8-5.2S7.4 4 12 4z" stroke-dasharray="2.6 2.3" />
            <path d="M7.4 13.4c-1 1.5-.9 3.4.8 4.2 1.6.7 1.8 2.2 1 3.4" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="shape" title="Formen (nochmal tippen: Form, Farbe, Füllung)" aria-label="Formen">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="10" width="9.5" height="9.5" rx="1.6" />
            <circle class="tip-ring" cx="15.5" cy="8.5" r="5" />
          </svg>
          <i class="swatch"><canvas class="paint" width="1" height="1"></canvas></i>
        </button>
        <button class="tool-btn" data-tool="fill" title="Füllen: in eine geschlossene Fläche tippen (nochmal tippen: Farbe)" aria-label="Füllen">
          <svg viewBox="0 0 24 24">
            <path d="M10.2 3.8 18.4 12l-6.6 6.6a2 2 0 0 1-2.8 0l-5.4-5.4a2 2 0 0 1 0-2.8z" />
            <path d="M4.2 11.6h13.6" />
            <path d="M8 2.5l2.2 2.2" />
            <path class="tip" d="M20.2 14.6c.9 1.4 1.5 2.5 1.5 3.3a1.5 1.5 0 0 1-3 0c0-.8.6-1.9 1.5-3.3z" />
          </svg>
          <i class="swatch"><canvas class="paint" width="1" height="1"></canvas></i>
        </button>
        <button class="tool-btn" data-tool="text" title="Text: auf die Seite tippen, um zu schreiben" aria-label="Text">
          <svg viewBox="0 0 24 24">
            <path d="M5 7V5h14v2M12 5v14M9 19h6" />
          </svg>
        </button>
        <!-- Lieblingsstifte (Stern im Stift-Menü), lange drücken entfernt sie -->
        <div id="favorites" class="favorites" hidden></div>
      </div>

      <div class="actions">
        <button id="btn-install" class="btn btn-accent" hidden>App installieren</button>
        <!-- Einfügen (Bild, Foto, PDF) und Teilen (PDF, Bild) – siehe mediamenu.js -->
        <button id="btn-insert" class="icon-btn" title="Einfügen: Bild, Foto, PDF" aria-label="Einfügen">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="13" height="13" rx="2.5" /><circle cx="8.3" cy="9.6" r="1.4" /><path d="m4 16 4-3.6 3 2.6 1.8-1.5 3.7 3" /><path d="M19.5 3.5v6M16.5 6.5h6" /></svg>
        </button>
        <button id="btn-share" class="icon-btn" title="Teilen und Exportieren (PDF, Bild)" aria-label="Teilen">
          <svg viewBox="0 0 24 24"><path d="M12 14.5V3.5M7.5 8 12 3.5 16.5 8" /><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg>
        </button>
        <!-- Seiten: neue Seite, Vorlage, Übersicht (siehe pages.js) -->
        <button id="btn-add-page" class="icon-btn" title="Seite hinzufügen" aria-label="Seite hinzufügen">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" /><path d="M12 9v6M9 12h6" /></svg>
        </button>
        <button id="btn-template" class="icon-btn" title="Seitenvorlage" aria-label="Seitenvorlage">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" /><path d="M5 8.5h14M5 13h14M5 17.5h14M10 3v18" stroke-width="1.3" /></svg>
        </button>
        <button id="btn-pages" class="btn pages-btn" title="Seitenübersicht" aria-label="Seitenübersicht">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg>
          <span>1 / 1</span>
        </button>
        <!-- Scroll-Sperre: kein Zoomen, kein seitliches Verrutschen beim Schreiben -->
        <button id="btn-lock" class="icon-btn" title="Scroll-Sperre" aria-label="Scroll-Sperre" aria-pressed="false">
          <svg viewBox="0 0 24 24" class="lock-open"><rect x="5" y="11" width="14" height="9.5" rx="2.2" /><path d="M8.5 11V7.5a3.5 3.5 0 0 1 6.8-1.2" /></svg>
          <svg viewBox="0 0 24 24" class="lock-closed"><rect x="5" y="11" width="14" height="9.5" rx="2.2" /><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11" /><path d="M12 14.6v2.4" /></svg>
        </button>
        <button id="btn-zoom" class="btn zoom-btn" title="Zoom zurücksetzen">100 %</button>
        <button id="btn-debug" class="icon-btn" title="Stift-Diagnose ein/aus" aria-label="Stift-Diagnose">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
        </button>
      </div>
    </header>

    <!-- Popup mit den Einstellungen des Werkzeugs (wird von toolbar.js gefüllt) -->
    <div id="popup" class="popup" hidden></div>
    <!-- Format-Leiste für Text (erscheint, während ein Textfeld bearbeitet wird) -->
    <div id="textbar" class="textbar" role="toolbar" aria-label="Text formatieren" hidden></div>
    <div id="textbar-pop" class="textbar-pop" hidden></div>
    <!-- Popup "Einfügen" / "Teilen" (wird von mediamenu.js gefüllt) -->
    <div id="media-popup" class="popup media-popup" hidden></div>
    <!-- Popup mit den Seitenvorlagen (wird von pages.js gefüllt) -->
    <div id="page-popup" class="popup page-popup" hidden></div>

    <!-- Die Zeichenfläche -->
    <main id="stage">
      <canvas id="canvas"></canvas>
      <!-- Großer Knopf unter der letzten Seite -->
      <button id="add-page-end" class="add-page-end" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>Seite hinzufügen
      </button>
      <!-- "Seite 2 von 5" – erscheint kurz beim Scrollen -->
      <div id="page-indicator" class="page-indicator" aria-live="polite"></div>
      <!-- Seitenübersicht mit kleinen Bildern aller Seiten -->
      <section id="overview" class="overview" hidden></section>
    </main>

    <!-- Startbildschirm mit allen Notizen und Ordnern (wird von home.js gefüllt) -->
    <div id="home" class="home" hidden></div>

    <!-- Diagnose-Fenster: zeigt, was der S Pen an die App schickt -->
    <aside id="debug" class="debug" hidden></aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
